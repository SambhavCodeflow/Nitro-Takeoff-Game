function playLoad(){homeOn=false;$('home').style.display='none';try{homeR&&homeR.dispose();homeR&&homeR.forceContextLoss()}catch(e){}const L=$('ld');L.classList.add('show');$('ldn').textContent=CN[hsel];
 const S=['Ignition','Engine start','Headlights on','Loading city'];$('steps').innerHTML=S.map(s=>'<li>'+s+'</li>').join('');const ok=i=>$('steps').children[i].classList.add('ok');
 let a;try{a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=380;g.gain.value=.0001;o.connect(f);f.connect(g);g.connect(a.destination);o.start();const t=a.currentTime;g.gain.setTargetAtTime(.09,t+.2,.05);for(let i=0;i<8;i++)o.frequency.setValueAtTime(i%2?30:18,t+.2+i*.1);o.frequency.setValueAtTime(40,t+1.05);o.frequency.linearRampToValueAtTime(130,t+1.3);o.frequency.linearRampToValueAtTime(58,t+1.9);o.frequency.linearRampToValueAtTime(120,t+2.6);o.frequency.linearRampToValueAtTime(58,t+3.1);g.gain.setTargetAtTime(0,t+3.2,.1)}catch(e){}
 const t0=performance.now();let st=0,started=false,t1=1e15;
 const tick=()=>{const t=(performance.now()-t0)/1000;let r=0;if(t>.2&&t<1.05)r=250+((t*10|0)%2)*180;else if(t>=1.05&&t<1.3)r=250+(t-1.05)/.25*3600;else if(t>=1.3&&t<1.9)r=3850-(t-1.3)/.6*2950;else if(t>=1.9&&t<2.6)r=900+(t-1.9)/.7*2300;else if(t>=2.6)r=3200-Math.min(1,(t-2.6)/.5)*2300;
  $('needle').setAttribute('transform','rotate('+(-120+r/8000*240).toFixed(1)+' 80 80)');$('lfill').setAttribute('stroke-dashoffset',(100-r/80).toFixed(1));$('rpm').textContent=Math.round(r/10)*10;$('ldf').style.width=Math.min(100,Math.max(0,(t-.2)/2.9*100))+'%';
  if(t>.2&&st<1){ok(0);st=1;$('ldt').textContent='Turning the key...'}
  if(t>1.05&&st<2){ok(1);st=2;$('ldt').textContent='Engine running'}
  if(t>1.6&&st<3){ok(2);st=3;L.classList.add('lights');$('ldt').textContent='Headlights on'}

  if(t>3.1&&st<4){ok(3);st=4;$('ldt').textContent='GO!'}
  if(t>3.5&&performance.now()-t1>900){L.classList.remove('show');try{a&&a.close()}catch(e){}return}
  requestAnimationFrame(tick)};tick()}
initTouch();
